[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluentry"
version = "1.0.3"
description = "Open source voice-to-text dictation app for Linux with on-device AI enhancement"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.6"]
# Whisper works out of the box; Parakeet needs onnx-asr, and the
# Nemotron and Cohere exports need sherpa-onnx.
whisper = ["faster-whisper>=1.0"]
parakeet = ["onnx-asr>=0.12", "onnxruntime>=1.17", "huggingface_hub>=0.24"]
onnx = ["sherpa-onnx>=1.10"]
audio = ["sounddevice>=0.4"]
input = ["evdev>=1.6", "pynput>=1.7"]
# The input path GNOME sanctions. `python-libei` is pure ctypes, but the
# libei/libeis/liboeffis shared libraries and PyGObject come from the
# distribution (libei1, liboeffis0, python3-gi). Without PyGObject the
# permission cannot be remembered and is asked for on every launch.
libei = ["python-libei>=0.5"]

[project.scripts]
fluentry = "fluentry.__main__:main"

[tool.setuptools.packages.find]
include = ["fluentry*"]

[tool.setuptools.package-data]
# The logo and its icon sizes ship with the app, and a short known
# recording: a speech runtime is only trusted after transcribing it. The
# i18n JSON files are the interface's translation catalogues.
fluentry = ["resources/*.png", "resources/runtime_check.wav", "resources/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-m 'not model and not hardware and not display and not slow'"
markers = [
    "model: needs downloaded speech-model weights",
    "hardware: needs real audio hardware",
    "display: needs a running display server",
    "slow: downloads from the network",
]
